name: CD pipeline

on:
  push:
    branches:
      - "main"
    paths:
      - "spark_jobs/carrier_analytics/**"
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1
  ARTIFACTS_PATH: s3://spark-apex-freight-data/artifacts/prod/carrier_analytics/

jobs:
  deploy:
    name: Sync Spark job to S3
    runs-on: ubuntu-24.04

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.OIDC_ROLE }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync carrier analytics job
        run: aws s3 sync spark_jobs/carrier_analytics/ $ARTIFACTS_PATH --delete
